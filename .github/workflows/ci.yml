name: Verificar fundação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
      - name: Instalar uv
        run: python -m pip install uv==0.7.21
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Testar no Linux
        if: runner.os != 'Windows'
        run: uv run --locked pytest
      - name: Validar guarda nativa de arquivos no Windows
        if: runner.os == 'Windows'
        run: uv run --locked python scripts/run-ci-tests.py -q -s --durations=4 apps/host/tests/test_provisioning_backend.py -k readonly_native_hardware_guard_without_hyperv
      - name: Testar no Windows com dono padrão da conta
        if: runner.os == 'Windows'
        run: uv run --locked python scripts/run-ci-tests.py

  web:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  container:
    name: Distribuição Docker / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
      - run: python -m pip install uv==0.7.21
      - run: uv sync --locked
      - run: docker compose config --quiet
      - run: docker compose build
      - run: .venv/bin/python scripts/check-container.py
      - run: docker build --target verification -t bees-verification:local .
      - run: docker run --rm --network none bees-verification:local
