[project]
name = "bees-core"
version = "0.1.0"
description = "Estado e contratos de domínio independentes de modelos e transporte"
requires-python = ">=3.14,<3.15"
dependencies = [
    "apsw==3.53.4.0",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pydantic>=2.12,<3",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bees_core"]
