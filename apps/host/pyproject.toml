[project]
name = "bees-host"
version = "0.1.0"
description = "Ponte local de diagnóstico somente leitura do hospedeiro Bees"
requires-python = ">=3.14,<3.15"
dependencies = ["cryptography>=46,<51", "httpx>=0.28,<1", "pydantic>=2.12,<3"]

[project.scripts]
bees-host = "bees_host.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bees_host"]
