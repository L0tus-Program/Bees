[project]
name = "bees-executor"
version = "0.1.0"
description = "Executor remoto do Bees: computador próprio da abelha e conector pessoal"
requires-python = ">=3.12"
dependencies = ["websockets>=13,<16"]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
documents = ["pypdf>=5,<7"]

[project.scripts]
bees-executor = "bees_executor.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bees_executor"]
