[project]
name = "bees-api"
version = "0.1.0"
description = "Serviço HTTP da plataforma Bees"
requires-python = ">=3.14,<3.15"
dependencies = [
    "apsw==3.53.4.0",
    "fastapi>=0.135,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.41,<1",
]

[project.scripts]
bees-api = "bees_api.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bees_api"]
