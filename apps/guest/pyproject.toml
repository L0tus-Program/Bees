[project]
name = "bees-guest"
version = "0.1.0"
description = "Ponte de diagnóstico restrita do guest Linux Bees"
requires-python = ">=3.13,<3.15"
dependencies = []

[project.scripts]
bees-guest = "bees_guest.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bees_guest"]
