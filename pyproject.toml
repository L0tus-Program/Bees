[project]
name = "bees-workspace"
version = "0.1.0"
description = "Fundação local da plataforma Bees"
requires-python = ">=3.14,<3.15"
dependencies = ["bees-api==0.1.0", "bees-worker==0.1.0"]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core"]

[tool.uv.sources]
bees-api = { workspace = true }
bees-core = { workspace = true }
bees-worker = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/core/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["bees_api", "bees_core", "bees_worker"]
